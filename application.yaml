apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  source:
    repoURL: https://github.com/Winniepoom/orders-api-config.git
    path: charts/orders-api
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true